version: '3.9'

# ─────────────────────────────────────────
# DivaraCraft – Full Stack Docker Compose
# Services: MySQL · Qdrant · AI Service · Admin Backend
# Frontend: run locally with  ng serve  (port 4200)
# ─────────────────────────────────────────

services:

  # ── 1. MySQL ───────────────────────────
  mysql:
    image: mysql:8.0
    container_name: divara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: divaracraft
      MYSQL_DATABASE: divara_craft
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdivaracraft"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 2. Qdrant Vector DB ────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: divara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # ── 3. FastAPI AI Service ──────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: divara-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: bangles
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 4. Admin Backend (Node.js) ─────────
  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: divara-admin-backend
    restart: unless-stopped
    ports:
      - "5002:5001"
    env_file:
      - ./backend/.env          # picks up Cloudinary keys etc.
    environment:
      # Override DB_* from env_file so container does not use localhost values.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: divaracraft
      DB_NAME: divara_craft
      DB_SOCKET: ""                   # disable socket path inside Docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: divaracraft
      MYSQL_SOCKET: ""
      # Override AI service URL to internal service name
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  mysql_data:
  qdrant_storage:
