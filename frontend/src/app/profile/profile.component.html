<section class="profile-page">
  <div class="profile-page__container">
    <header class="profile-page__header">
      <h1>My Profile</h1>
      <p>Update your account details below.</p>
    </header>

    <section class="profile-avatar-editor" aria-label="Profile picture editor">
      <div class="profile-avatar-editor__preview-wrap">
        <div class="profile-avatar-editor__preview">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="Profile preview" referrerpolicy="no-referrer" (error)="onAvatarPreviewError()">
          <span *ngIf="!avatarUrl">No photo</span>
        </div>
      </div>

      <div class="profile-avatar-editor__controls">
        <label class="profile-avatar-editor__upload-btn">
          Upload Image
          <input type="file" accept="image/*" (change)="onAvatarFileChange($event)">
        </label>
        <button type="button" class="profile-avatar-editor__remove-btn" *ngIf="avatarUrl" (click)="removeAvatar()">Remove</button>
      </div>

      <div class="profile-avatar-crop" *ngIf="cropSourceImage">
        <h3>Crop Image</h3>
        <p class="profile-avatar-crop__hint">Drag to move • Scroll to zoom</p>
        <div
          class="profile-avatar-crop__stage"
          (mousedown)="onCropMouseDown($event)"
          (wheel)="onCropWheel($event)">
          <img 
            [src]="cropSourceImage" 
            alt="Crop source" 
            class="profile-avatar-crop__image"
            [ngStyle]="{'transform': 'translate(' + cropDragOffsetX + 'px, ' + cropDragOffsetY + 'px) scale(' + cropScaleFactor + ')'}">
        </div>

        <div class="profile-avatar-crop__actions">
          <button type="button" class="profile-avatar-crop__cancel" (click)="cancelCrop()">Cancel</button>
          <button type="button" class="profile-avatar-crop__apply" [disabled]="isApplyingCrop" (click)="applyCrop()">
            {{ isApplyingCrop ? 'Applying...' : 'Apply Crop' }}
          </button>
        </div>
      </div>
    </section>

    <form class="profile-form" (ngSubmit)="submit()">
      <label class="profile-form__field">
        <span>Full Name</span>
        <input
          type="text"
          name="name"
          [value]="name"
          (input)="onNameInput($event)"
          placeholder="Enter your name"
          required>
      </label>

      <div class="profile-form__field">
        <span>Email Address</span>
        <div class="profile-form__email-row">
          <input
            type="email"
            name="email"
            [value]="email"
            (input)="onEmailInput($event)"
            placeholder="name@example.com"
            required>
          <button
            type="button"
            class="profile-form__verify-email-btn"
            *ngIf="showVerifyBtn"
            [disabled]="isRequestingVerification"
            (click)="requestVerificationFromBtn()">
            {{ isRequestingVerification ? 'Sending...' : 'Verify' }}
          </button>
        </div>
        <span class="profile-form__email-hint is-error" *ngIf="showEmailFormatError">
          Enter a valid email address.
        </span>
        <span class="profile-form__email-hint is-info" *ngIf="showVerifyBtn">
          A verification code will be sent to your new email.
        </span>
        <span class="profile-form__email-hint is-success" *ngIf="emailVerified">
          &#10003; Email verified.
        </span>
      </div>

      <label class="profile-form__field">
        <span>Mobile Number</span>
        <input
          type="tel"
          name="phone"
          [value]="phone"
          (input)="onPhoneInput($event)"
          placeholder="Enter mobile number">
      </label>

      <p class="profile-form__message is-success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="profile-form__message is-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="profile-form__submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Update Profile' }}
      </button>

      <div class="profile-form__verify" *ngIf="verificationCodeSent">
        <label class="profile-form__field">
          <span>Email Verification Code</span>
          <input
            type="text"
            name="verificationCode"
            [value]="verificationCode"
            (input)="onVerificationCodeInput($event)"
            placeholder="Enter 6-digit code"
            maxlength="6">
        </label>

        <button type="button" class="profile-form__verify-btn" [disabled]="isVerifyingEmail" (click)="verifyAndUpdateEmail()">
          {{ isVerifyingEmail ? 'Verifying...' : 'Verify Email & Update' }}
        </button>
      </div>
    </form>
  </div>
</section>
