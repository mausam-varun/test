<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="admin-sidebar" [class.open]="sidebarOpen">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#2563eb"/>
          <path d="M10 28L20 12l10 16H10z" fill="#fff" opacity=".9"/>
          <circle cx="20" cy="21" r="3" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text" *ngIf="sidebarOpen">
        <span class="brand-name">DivaraCraft</span>
        <span class="brand-sub">Admin Panel</span>
      </div>
    </div>

    <!-- Nav menus -->
    <nav class="sidebar-nav">
      <p class="nav-section-label" *ngIf="sidebarOpen">CATALOGUE</p>

      <!-- Regular nav items (no children) -->
      <ng-container *ngFor="let item of navItems; let i = index">
        <a
          *ngIf="!item.children"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [title]="!sidebarOpen ? item.label : ''"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="item.icon"/>
          </svg>
          <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
        </a>
      </ng-container>

      <!-- Group items (with children) -->
      <ng-container *ngFor="let item of navItems; let i = index">
        <ng-container *ngIf="item.children && item.children.length > 0">
          <!-- Group header -->
          <button
            class="nav-group-header"
            [class.nav-group-header--expanded]="isGroupExpanded(item.label)"
            (click)="toggleGroupExpand(item.label)"
            [title]="!sidebarOpen ? item.label : ''"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="item.icon"/>
            </svg>
            <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
            <svg class="nav-group-chevron" *ngIf="sidebarOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Group children (collapsed by default) -->
          <div class="nav-group-children" *ngIf="isGroupExpanded(item.label) && sidebarOpen">
            <a
              *ngFor="let child of item.children"
              class="nav-item nav-item--child"
              [routerLink]="child.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="child.icon"/>
              </svg>
              <span class="nav-label">{{ child.label }}</span>
            </a>
          </div>
        </ng-container>
      </ng-container>

        <!-- Currency Settings: super_admin only -->
        <ng-container *ngIf="isSuperAdmin">
          <p class="nav-section-label" *ngIf="sidebarOpen" style="margin-top:12px">SETTINGS</p>
          <a
            class="nav-item nav-item--accent"
            [routerLink]="superAdminNavItem.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            [title]="!sidebarOpen ? superAdminNavItem.label : ''"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span class="nav-label" *ngIf="sidebarOpen">{{ superAdminNavItem.label }}</span>
          </a>
        </ng-container>
    </nav>

    <!-- Sidebar footer -->
    <div class="sidebar-footer" *ngIf="sidebarOpen">
      <span>DivaraCraft &copy; 2026</span>
    </div>
  </aside>

  <!-- ── Overlay (mobile) ───────────────────────────────── -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <!-- ── Main area ──────────────────────────────────────── -->
  <div class="admin-main">

    <!-- Top Header -->
    <header class="admin-header">
      <button class="btn-toggle" (click)="toggleSidebar()" [title]="sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="header-breadcrumb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="color:#94a3b8">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Admin</span>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-active">
          <ng-container *ngFor="let item of navItems">
            <ng-container *ngIf="item.route && isActive(item.route)">{{ item.label }}</ng-container>
          </ng-container>
        </span>
      </div>

      <div class="header-right">
        <div class="header-currency-control">
          <label for="admin-header-currency">Currency</label>
          <select
            id="admin-header-currency"
            [(ngModel)]="selectedCurrency"
            [disabled]="isSavingCurrency"
            (change)="onHeaderCurrencyChange()"
          >
            <option *ngFor="let option of currencyOptions" [value]="option.value">{{ option.label }}</option>
          </select>
          <small *ngIf="currencyMessage">{{ currencyMessage }}</small>
        </div>
        <div class="admin-profile-menu">
          <button
            type="button"
            class="profile-trigger"
            title="Admin menu"
            (click)="toggleProfileMenu($event)"
            [attr.aria-expanded]="isProfileMenuOpen"
            aria-haspopup="true"
          >
            <div class="admin-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="admin-info">
              <span class="admin-name">Admin</span>
              <span class="admin-role">Super Admin</span>
            </div>
          </button>

          <div class="profile-dropdown" *ngIf="isProfileMenuOpen" role="menu" aria-label="Admin profile menu">
            <button type="button" class="dropdown-item" role="menuitem" (click)="onLogout($event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="admin-footer">
      <span>DivaraCraft Admin Panel</span>
      <span class="footer-sep">·</span>
      <span>Version 1.0</span>
      <span class="footer-sep">·</span>
      <span>&copy; 2026 DivaraCraft. All rights reserved.</span>
    </footer>
  </div>

</div>
