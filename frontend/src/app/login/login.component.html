<div class="login-page">

  <div class="login-container">

    <!-- Card -->
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="#2563eb"/>
            <path d="M10 28L20 12l10 16H10z" fill="#fff" opacity=".9"/>
            <circle cx="20" cy="21" r="3" fill="#fff"/>
          </svg>
        </div>
        <h1>DivaraCraft</h1>
        <p>Admin Panel Login</p>
      </div>

      <!-- Form -->
      <form class="login-form" (ngSubmit)="onSubmit()">

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="admin@example.com"
            [(ngModel)]="email"
            name="email"
            (focus)="clearError()"
            required
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            (focus)="clearError()"
            required
          />
        </div>

        <!-- Error message -->
        <div class="message error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <!-- Success message -->
        <div class="message success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <!-- Submit button -->
        <button
          type="submit"
          class="btn-login"
          [disabled]="isLoading"
        >
          <ng-container *ngIf="!isLoading">Sign In</ng-container>
          <ng-container *ngIf="isLoading">Signing in...</ng-container>
        </button>

        <a class="auth-link" routerLink="/admin/signup">Create a new admin account</a>

      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p>© 2026 DivaraCraft. All rights reserved.</p>
      </div>

    </div>

  </div>

</div>
