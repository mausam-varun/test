<article class="product-card">
  <div class="product-card__image-wrap">
    <a class="product-card__image-link" [routerLink]="['/product', product.id]" aria-label="View product details">
      <img [src]="product.image" [alt]="product.name" loading="lazy">
    </a>
    <button
      type="button"
      class="wishlist-btn"
      [class.is-wishlisted]="isWishlisted"
      [class.is-click-animating]="isWishlistClickAnimating"
      (click)="onWishlist()"
      aria-label="Add to wishlist">
      ♡
      <span class="wishlist-btn__burst" aria-hidden="true">
        <span
          class="wishlist-btn__particle"
          *ngFor="let particle of wishlistBurstParticles"
          [style.--tx.px]="particle.x"
          [style.--ty.px]="particle.y"
          [style.--size.px]="particle.size"
          [style.animationDelay.s]="particle.delay">
        </span>
      </span>
    </button>
  </div>

  <a class="product-card__name-link" [routerLink]="['/product', product.id]">
    <h3 class="product-card__name">{{ product.name }}</h3>
  </a>

  <p class="product-card__rating" aria-label="Product rating">
    <span class="stars">★★★★★</span>
    <span class="count">({{ product.reviews }})</span>
  </p>

  <p class="product-card__price">{{ product.price | displayCurrency:2 }}</p>

  <button type="button" class="product-card__button add-to-cart" [class.is-added]="isAdded" (click)="onAdd()" *ngIf="!isAdded">
    <ng-container>
      Add to Cart <span aria-hidden="true">→</span>
    </ng-container>
  </button>

  <div class="product-card__quantity-control" *ngIf="isAdded">
    <button type="button" class="quantity-btn decrease" (click)="onDecrement()" aria-label="Decrease quantity">−</button>
    <span class="quantity-display">{{ quantity }}</span>
    <button type="button" class="quantity-btn increase" (click)="onIncrement()" aria-label="Increase quantity">+</button>
  </div>
</article>
