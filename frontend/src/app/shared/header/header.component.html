<header class="navbar">
  <div class="navbar-container">
    <a class="logo" routerLink="/" aria-label="Divara Craft home">
      <img src="assets/divara_final.jpg" alt="Divara Craft" class="logo-img">
    </a>

    <nav class="nav-links" aria-label="Primary navigation">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a class="nav-link" routerLink="/shop" routerLinkActive="active">Shop</a>
      <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
      <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <div class="nav-tools">
      <button type="button" class="account-link" title="Sign Up" (click)="openSignupPopup()" *ngIf="!isAuthenticated">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Sign Up</span>
      </button>

      <!-- Wishlist Icon -->
      <a class="action-link wishlist" routerLink="/wishlist" aria-label="Wishlist" [class.wishlist-bump]="isWishlistBumping" (click)="onWishlistIconClick()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="wishlist-crackers" aria-hidden="true">
          <span
            class="wishlist-cracker"
            *ngFor="let particle of wishlistBurstParticles"
            [style.--tx.px]="particle.x"
            [style.--ty.px]="particle.y"
            [style.--size.px]="particle.size"
            [style.animationDelay.s]="particle.delay">
          </span>
        </span>
        <span class="wishlist-count" *ngIf="wishlistCount > 0" [class.wishlist-count-bump]="isWishlistBumping">{{ wishlistCount }}</span>
      </a>

      <!-- Cart Icon -->
      <a class="action-link cart" routerLink="/checkout" aria-label="Cart" [class.cart-bump]="isCartBumping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39A2 2 0 0 0 9.63 16h9.72a2 2 0 0 0 1.95-1.61L23 6H6"></path>
        </svg>
        <span class="cart-crackers" aria-hidden="true">
          <span
            class="cart-cracker"
            *ngFor="let particle of cartBurstParticles"
            [style.--tx.px]="particle.x"
            [style.--ty.px]="particle.y"
            [style.--size.px]="particle.size"
            [style.animationDelay.s]="particle.delay">
          </span>
        </span>
        <span class="cart-count" [class.cart-count-bump]="isCartBumping">{{ cartCount }}</span>
      </a>

      <!-- Profile Dropdown (Authenticated Users Only) -->
      <div class="profile-menu" *ngIf="isAuthenticated">
        <button
          type="button"
          class="profile-button"
          title="User profile menu"
          (click)="toggleProfileMenu($event)"
          aria-haspopup="menu"
          [attr.aria-expanded]="isProfileMenuOpen">
          <div class="profile-avatar">
            <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="Profile" class="profile-avatar-img">
            <span *ngIf="!userAvatarUrl">{{ userInitials }}</span>
          </div>
        </button>

        <!-- Dropdown Menu -->
        <div class="profile-dropdown" *ngIf="isProfileMenuOpen" role="menu">
          <a routerLink="/" class="dropdown-item mobile-only-menu-item" (click)="closeProfileMenu()" role="menuitem">
            <span>Home</span>
          </a>
          <a routerLink="/shop" class="dropdown-item mobile-only-menu-item" (click)="closeProfileMenu()" role="menuitem">
            <span>Shop</span>
          </a>
          <a routerLink="/about" class="dropdown-item mobile-only-menu-item" (click)="closeProfileMenu()" role="menuitem">
            <span>About</span>
          </a>
          <a routerLink="/contact" class="dropdown-item mobile-only-menu-item" (click)="closeProfileMenu()" role="menuitem">
            <span>Contact</span>
          </a>
          <button
            type="button"
            class="dropdown-item"
            (click)="editProfile($event)"
            role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Edit Profile</span>
          </button>
          <button
            type="button"
            class="dropdown-item"
            (click)="logout($event)"
            role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
